# BoppOS kernel-argument preset. On by default, but only on the device it matches; switch it off in boppos-deck (Kernel arguments).
description = Stop random reboots on the AYANEO SLIDE
category = Device fixes
risk_level = low
risk = Makes the kernel stricter about ACPI resource conflicts, which stops random reboots on the SLIDE. Only matches that model.
kargs = acpi=strict
enabled = true
match.product_name = SLIDE | AYANEO SLIDE
