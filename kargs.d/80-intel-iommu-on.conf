# BoppOS kernel-argument preset. Off by default; switch it on in boppos-deck (Kernel arguments).
description = Turn on the Intel IOMMU (for passing devices to virtual machines)
category = Virtualization
risk_level = medium
risk = Needed to give a graphics card or other device to a virtual machine. Can cause problems with some devices and costs a little speed. Only useful on Intel CPUs.
kargs = intel_iommu=on
enabled = false
