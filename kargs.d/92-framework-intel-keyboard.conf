# BoppOS kernel-argument preset. On by default, but only on the device it matches; switch it off in boppos-deck (Kernel arguments).
description = Fix the keyboard on Framework laptops with Intel processors
category = Device fixes
risk_level = low
risk = Blocks the hid_sensor_hub module, which breaks the keyboard on these laptops. Screen auto-rotation and ambient light sensors that use that module stop working. Only matches Framework laptops with Intel in the model name.
kargs = module_blacklist=hid_sensor_hub
enabled = true
match.sys_vendor = Framework
match.product_name = *Intel*
