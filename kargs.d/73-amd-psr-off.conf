# BoppOS kernel-argument preset. Off by default; switch it on in boppos-deck (Kernel arguments).
description = Turn off Panel Self Refresh on AMD graphics
category = Display fixes
risk_level = low
risk = Fixes flicker or artifacts on some AMD laptop and handheld panels. The display stays in a higher-power state, so battery life drops. Some panels need a different value than this one. Only useful with AMD graphics.
kargs = amdgpu.dcdebugmask=0x10
enabled = false
