# BoppOS kernel-argument preset. Off by default; switch it on in boppos-deck (Kernel arguments).
description = Use the Nvidia framebuffer console driver
category = Graphics
risk_level = medium
risk = Helps some Nvidia setups keep a working console and resume from sleep. Experimental in the driver. Only useful with the Nvidia driver.
kargs = nvidia-drm.fbdev=1
enabled = false
