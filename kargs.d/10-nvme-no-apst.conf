# BoppOS kernel-argument preset. Off by default; switch it on in boppos-deck (Kernel arguments).
description = Turn off NVMe power-state switching (APST)
category = Stability
risk_level = low
risk = Uses a little more power when idle. Helps SSDs that freeze, disappear or throw errors under load, which is a known problem on some laptops.
kargs = nvme_core.default_ps_max_latency_us=0
enabled = false
