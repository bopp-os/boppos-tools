# BoppOS kernel-argument preset. Off by default; switch it on in boppos-deck (Kernel arguments).
description = Turn on Nvidia kernel mode setting
category = Graphics
risk_level = low
risk = Needed for Wayland and tear-free output on older Nvidia drivers; newer drivers may already enable it. Only useful with the Nvidia driver.
kargs = nvidia-drm.modeset=1
enabled = false
