# BoppOS kernel-argument preset. On by default, but only on the device it matches; switch it off in boppos-deck (Kernel arguments).
description = Make the Legion Go brightness controls work
category = Device fixes
risk_level = low
risk = The Legion Go firmware's brightness curve leaves the panel at full brightness whatever level is set, so this makes the driver ignore that curve. Only matches the original Legion Go. Switching it off makes the brightness controls stop working. Sets the same option as the PSR preset, so only one of the two takes effect.
kargs = amdgpu.dcdebugmask=0x40000
enabled = true
match.product_version = Legion Go 8APU1
