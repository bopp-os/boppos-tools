# BoppOS kernel-argument preset. Off by default; switch it on in boppos-deck (Kernel arguments).
description = Keep an AMD graphics card powered instead of letting it sleep
category = Stability
risk_level = low
risk = Fixes black screens and hangs after idle on some desktops and laptops. Uses more power at idle. Only useful with AMD graphics.
kargs = amdgpu.runpm=0
enabled = false
