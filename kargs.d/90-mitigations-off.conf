# BoppOS kernel-argument preset. Off by default; switch it on in boppos-deck (Kernel arguments).
description = Turn off CPU security mitigations (Spectre, Meltdown and others)
category = Performance
risk_level = high
risk = Can be noticeably faster, but programs you run, including web pages, can attack the system more easily. Not recommended on a machine that browses the web or runs software you do not fully trust.
kargs = mitigations=off
enabled = false
