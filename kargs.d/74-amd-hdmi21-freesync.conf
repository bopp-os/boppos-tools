# BoppOS kernel-argument preset. Off by default; switch it on in boppos-deck (Kernel arguments).
description = Enable AMD HDMI 2.1 and FreeSync display features
category = Display fixes
risk_level = medium
risk = Bazzite offers this for HDMI 2.1 and FreeSync over HDMI. It can cause flicker or instability on some displays. Only useful with AMD graphics.
kargs = amdgpu.dcfeaturemask=0x402
enabled = false
