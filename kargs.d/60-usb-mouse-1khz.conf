# BoppOS kernel-argument preset. Off by default; switch it on in boppos-deck (Kernel arguments).
description = Poll USB mice 1000 times a second
category = Performance
risk_level = low
risk = Lowers input latency for gaming mice. Uses slightly more CPU time, and a few very old mice misbehave.
kargs = usbhid.mousepoll=1
enabled = false
