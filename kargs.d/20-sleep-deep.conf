# BoppOS kernel-argument preset. Off by default; switch it on in boppos-deck (Kernel arguments).
description = Use deep sleep (S3) instead of s2idle when suspending
category = Power & sleep
risk_level = medium
risk = If this machine's firmware has no deep sleep, suspend can fail or the system may not wake up. Many newer laptops and handhelds only support s2idle. Test suspend and resume after enabling.
kargs = mem_sleep_default=deep
enabled = false
