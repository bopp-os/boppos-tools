# BoppOS kernel-argument preset. Off by default; switch it on in boppos-deck (Kernel arguments).
description = Make virtual machine guests more tolerant
category = Virtualization
risk_level = low
risk = Lets guests that read CPU registers the host does not expose (some Windows guests) keep running instead of crashing. Only useful if you run virtual machines.
kargs = kvm.ignore_msrs=1 kvm.report_ignored_msrs=0
enabled = false
