# BoppOS kernel-argument preset. Off by default; switch it on in boppos-deck (Kernel arguments).
description = Unlock AMD GPU overclocking, undervolting and fan control, for tools such as LACT
category = Performance
risk_level = high
risk = Lets tools set clocks and voltages that can crash the GPU or damage it if misused, and marks the kernel as tainted. Only useful with AMD graphics.
kargs = amdgpu.ppfeaturemask=0xffffffff
enabled = false
