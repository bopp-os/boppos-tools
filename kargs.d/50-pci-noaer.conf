# BoppOS kernel-argument preset. Off by default; switch it on in boppos-deck (Kernel arguments).
description = Hide PCIe Advanced Error Reporting messages
category = Stability
risk_level = medium
risk = Stops PCIe error messages from flooding the log. Real hardware problems on the PCIe bus will no longer be reported, which makes them harder to diagnose.
kargs = pci=noaer
enabled = false
