# BoppOS kernel-argument preset. Off by default; switch it on in boppos-deck (Kernel arguments).
description = Turn off scatter-gather display on AMD graphics
category = Display fixes
risk_level = low
risk = Fixes flickering or a blank screen on some AMD laptops and handhelds. Costs a little memory bandwidth. Only useful with AMD graphics.
kargs = amdgpu.sg_display=0
enabled = false
