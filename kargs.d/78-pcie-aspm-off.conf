# BoppOS kernel-argument preset. Off by default; switch it on in boppos-deck (Kernel arguments).
description = Turn off PCIe power saving (Intel Ethernet fix)
category = Power & sleep
risk_level = medium
risk = Fixes dropped connections on Intel igc Ethernet controllers. Raises idle power use on every PCIe device, not only the network card.
kargs = pcie_aspm=off pcie_aspm.policy=performance
enabled = false
