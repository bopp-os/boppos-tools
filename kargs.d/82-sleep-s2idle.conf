# BoppOS kernel-argument preset. Off by default; switch it on in boppos-deck (Kernel arguments).
description = Use s2idle instead of deep sleep
category = Power & sleep
risk_level = low
risk = For machines that fail to wake from deep sleep. s2idle uses more battery while asleep. The opposite of the deep sleep preset; switch on only one.
kargs = mem_sleep_default=s2idle
enabled = false
