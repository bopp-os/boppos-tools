# BoppOS kernel-argument preset. On by default, but only on the device it matches; switch it off in boppos-deck (Kernel arguments).
description = Turn the ONEXPLAYER F1 panel upright and keep boot quiet
category = Device fixes
risk_level = low
risk = The F1 panel is built in portrait, so the boot screen shows sideways without this. Only matches the ONEXPLAYER F1 and F1 EVA-01. Switching it off turns the boot screen sideways again.
kargs = video=eDP-1:panel_orientation=left_side_up plymouth.use-simpledrm=0 loglevel=0
enabled = true
match.product_name = ONEXPLAYER F1*
