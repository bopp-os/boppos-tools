# BoppOS kernel-argument preset. Off by default; switch it on in boppos-deck (Kernel arguments).
description = Keep Nvidia video memory across sleep
category = Power & sleep
risk_level = medium
risk = Fixes a black or corrupted screen after resume on some Nvidia setups. Needs the nvidia-suspend, nvidia-resume and nvidia-hibernate services to be enabled. Only useful with the Nvidia driver.
kargs = nvidia.NVreg_PreserveVideoMemoryAllocations=1
enabled = false
