# BoppOS kernel-argument preset. Off by default; switch it on in boppos-deck (Kernel arguments).
description = Fix sleep problems on older Intel graphics
category = Power & sleep
risk_level = low
risk = Avoids random reboots or failed suspend on Intel graphics from about 2012 to 2015. Uses more power while the screen is idle. Only useful with Intel graphics.
kargs = i915.enable_dc=0
enabled = false
