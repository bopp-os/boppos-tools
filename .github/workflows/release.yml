name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'packaging/arch/PKGBUILD'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run CI Checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Create GitHub Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version and existing release
        id: check_release
        run: |
          PKGVER=$(grep -E '^pkgver=' packaging/arch/PKGBUILD | cut -d= -f2 | tr -d '[:space:]"')
          TAG="v${PKGVER}"
          echo "Detected version: ${PKGVER} (tag: ${TAG})"
          
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists on remote repository. Skipping release."
            echo "create_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${TAG} does not exist on remote repository. Creating release."
            echo "create_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check_release.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.check_release.outputs.tag }}"
          echo "Creating release ${TAG} for commit ${GITHUB_SHA}..."
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            --target "${GITHUB_SHA}"

      # Publish the source archive and its checksum with the release. GitHub's auto-generated tag archive has no
      # published hash, and it contains the PKGBUILD, so the PKGBUILD cannot carry its hash. An uploaded asset
      # is a fixed file and gets a sha256 digest in the API, which packaging repos can read.
      # Also backfills a release that has none: run this workflow by hand (workflow_dispatch).
      - name: Attach the source archive and SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKGVER=$(grep -E '^pkgver=' packaging/arch/PKGBUILD | cut -d= -f2 | tr -d '[:space:]"')
          TAG="v${PKGVER}"
          NAME="boppos-tools-${PKGVER}.tar.gz"
          if gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -qx "${NAME}"; then
            echo "${TAG} already has ${NAME}. Nothing to attach."
            exit 0
          fi
          git fetch --tags --force origin
          # The folder prefix is what the PKGBUILD's package() cd's into (${pkgbase}-${pkgver})
          git archive --format=tar --prefix="boppos-tools-${PKGVER}/" "${TAG}" | gzip -n -9 > "${NAME}"
          sha256sum "${NAME}" | tee SHA256SUMS
          gh release upload "${TAG}" "${NAME}" SHA256SUMS
