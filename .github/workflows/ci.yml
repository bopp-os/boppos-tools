name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate shell script syntax
        run: |
          echo "Checking shell scripts for syntax errors..."
          for f in bin/* lib/boppos/* share/boppos/*.sh; do
            if [ -f "$f" ]; then
              if head -n 1 "$f" | grep -E -q 'bash|sh'; then
                echo "  Checking $f"
                bash -n "$f"
              fi
            fi
          done

      - name: Check litterbox-pkg-update has no single quotes or backslashes
        run: |
          # boppos-update sends this file as sh -c '<file>', so these would break the quoting
          if grep -n -E "['\\\\]" lib/boppos/litterbox-pkg-update; then
            echo "::error file=lib/boppos/litterbox-pkg-update::contains a single quote or backslash"
            exit 1
          fi

      - name: Validate Python script syntax
        run: |
          echo "Checking Python scripts for syntax errors..."
          for f in bin/* lib/boppos/*; do
            if [ -f "$f" ]; then
              if head -n 1 "$f" | grep -q 'python'; then
                echo "  Checking $f"
                python3 -c "import ast, sys; ast.parse(open(sys.argv[1]).read(), sys.argv[1])" "$f"
              fi
            fi
          done

      - name: Lint shell scripts (shellcheck)
        run: |
          for f in bin/* lib/boppos/* libexec/boppos/* share/boppos/*.sh tools/*; do
            if [ -f "$f" ] && head -n 1 "$f" | grep -E -q 'bash|/sh'; then
              shellcheck -S warning "$f"
            fi
          done

      - name: Lint and test Python (ruff, pytest)
        run: |
          pip install pytest ruff
          py=$(grep -lE '^#!.*python' bin/* libexec/boppos/* lib/boppos/* boot/grub/* 2>/dev/null || true)
          # shellcheck disable=SC2086
          ruff check lib/boppos/py tests $py
          pytest -q

      - name: Test installation with Makefile
        run: |
          echo "Testing Makefile installation targets..."
          TMP_DEST=$(mktemp -d)
          make DESTDIR="$TMP_DEST" install
          # The Makefile installs by glob, so a stray file in the repo would ship: fail on the usual suspects.
          stray=$(find "$TMP_DEST" \( -name '__pycache__' -o -name '*.pyc' -o -name '*~' -o -name '*.bak' \
            -o -name '*.orig' -o -name '*.swp' -o -name 'uv.lock' -o -name '.DS_Store' \))
          if [ -n "$stray" ]; then
            echo "::error::unexpected files in the installed tree:"; echo "$stray"; exit 1
          fi
          rm -rf "$TMP_DEST"

      - name: Validate PKGBUILD & .SRCINFO consistency
        run: |
          echo "Verifying packaging/arch/.SRCINFO matches packaging/arch/PKGBUILD..."
          SRCINFO_GENERATED=$(docker run --rm -v "$PWD/packaging/arch/PKGBUILD:/tmp/PKGBUILD:ro" archlinux:latest bash -c '
            useradd -m builder && \
            cp /tmp/PKGBUILD /home/builder/PKGBUILD && \
            chown builder:builder /home/builder/PKGBUILD && \
            su builder -c "cd /home/builder && makepkg --printsrcinfo"
          ')
          diff -u <(echo "$SRCINFO_GENERATED") packaging/arch/.SRCINFO
